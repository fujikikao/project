<script type="text/javascript">
//取得視窗寬度跟高度
var ScreenWidth = $(window).width();
var ScreenHeight = $(window).height();

//由頁面底部往上瀏覽時的場景進度
var currentScroll;
var sceneLength = ScreenWidth * 5.02;
var sceneElements = [];
var playerPosition = {x: 0, y: 0};
var playerTarget = null;
var playerKeys = {};
var playerControlled = false;
var playerFrame = null;
var previousPlayerFrame = 0;
var playerSpeed = 280;

function getScrollDistance()
{
	var documentHeight = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
	return Math.max(0, documentHeight - $(window).height());
}

function layoutVerticalScene()
{
	$("body").addClass("vertical-layout");
	var width = $(window).width();
	var height = $(window).height();
	var backgroundHeight = 0;
	$("#Bg .scene-background").each(function()
	{
		backgroundHeight += width * parseFloat(this.getAttribute("height")) /
			parseFloat(this.getAttribute("width"));
	});
	sceneLength = Math.max(width * 5.02, backgroundHeight);
	var sceneScale = sceneLength / 5.02;

	if (sceneElements.length === 0)
	{
		$("#content").find("*").each(function()
		{
			var element = this;
			var style = window.getComputedStyle(element);
			var isSceneElement = style.position === "fixed" ||
				(style.position === "absolute" && element.offsetParent === document.getElementById("content"));

			if (isSceneElement)
			{
				sceneElements.push({
					element: element,
					progress: parseFloat(style.left) / width,
					crossAxis: parseFloat(style.top) / height
				});
			}
		});
	}

	$("#content, #scrollTrack").css("height", sceneLength + "px");
	$("#content").css("min-height", sceneLength + "px");

	sceneElements.forEach(function(item)
	{
		var id = item.element.id;
		var top = sceneLength - item.progress * sceneScale - item.element.offsetHeight;
		var left = item.crossAxis * width;

		if (id.indexOf("Cloud") === 0 && !/^bg_Cloud/.test(id))
		{
			left = (width - item.element.offsetWidth) / 2;
			if (id === "Cloud1")
			{
				top -= 180;
			}
		}
		else if (/^bg_Cloud/.test(id))
		{
			var cloudNumber = parseInt(id.replace("bg_Cloud", ""), 10);
			left = cloudNumber % 2 === 0
				? width - item.element.offsetWidth - width * 0.04
				: width * 0.04;
		}
		else if (/^content[123]$/.test(id))
		{
			var skillNumber = parseInt(id.replace("content", ""), 10);
			left = (width - item.element.offsetWidth) / 2;
			top += 235 + (skillNumber - 1) * 70;
		}
		else if (id === "Player")
		{
			left = width * 0.16;
			top = sceneLength - height * 0.9;
		}
		else if (id === "Pig")
		{
			left = width * 0.56;
		}
		else if (/^FlyPig[1-7]$/.test(id))
		{
			left = id === "FlyPig1" || id === "FlyPig3" || id === "FlyPig5" || id === "FlyPig7"
				? width * 0.06
				: width - item.element.offsetWidth - 24;
			if (/^FlyPig[1-3]$/.test(id))
			{
				top += 260;
			}
		}
		else if (id === "Cave")
		{
			left = width * 0.58;
			top += 500;
		}
		else if (/^Bat/.test(id))
		{
			var batNumber = parseInt(id.replace("Bat", ""), 10);
			top += (batNumber % 4) * 90;
		}
		else if (id === "Pumpkin1")
		{
			left = width * 0.76;
		}
		else if (id === "Pumpkin2")
		{
			left = width * 0.12;
		}
		else if (id === "content4")
		{
			left = (width - item.element.offsetWidth) / 2;
			top = sceneLength - 0.05 * sceneScale - 70;
		}

		item.element.style.position = "absolute";
		item.element.style.left = left + "px";
		item.element.style.top = top + "px";
		item.element.style.right = "auto";
		item.element.style.bottom = "auto";
	});

	var backgroundBottom = sceneLength;
	$("#Bg .scene-background").each(function()
	{
		var imageHeight = width * parseFloat(this.getAttribute("height")) /
			parseFloat(this.getAttribute("width"));
		backgroundBottom -= imageHeight;
		$(this).css({
			left: 0,
			top: backgroundBottom + "px",
			width: width + "px",
			height: imageHeight + "px"
		});
	});
	$("#Bg").css({left: 0, top: 0, width: width + "px", height: sceneLength + "px"});
	$("#RainBow").css({left: 0, top: (sceneLength * 0.46) + "px"});
	$("#Floor1").css({left: 0, top: (sceneLength - 42) + "px"});
	$("#Floor2").css({left: 0, top: (sceneLength - 112) + "px"});
	$("#Grass1, #Grass2").css({left: 0, top: (sceneLength - 155) + "px"});
	$("#Fences1, #Fences2").css({left: 0, top: (sceneLength - 220) + "px"});
	$("#Cloud5").css("top", "48px");
	updateVerticalPlayer();
}

function updateVerticalPlayer()
{
	if (!$("body").hasClass("vertical-layout"))
	{
		return;
	}

	if (playerControlled)
	{
		renderPlayerPosition();
		return;
	}

	var viewportHeight = $(window).height();
	var playerHeight = $("#Player").outerHeight();
	var maxScroll = getScrollDistance();
	var scrollProgress = maxScroll - $(window).scrollTop();
	var travelDistance = Math.max(0, viewportHeight - playerHeight - 48);
	var progressRatio = maxScroll > 0 ? Math.max(0, Math.min(1, scrollProgress / maxScroll)) : 0;
	var screenTop = viewportHeight - playerHeight - 24 - progressRatio * travelDistance;

	$("#Player").css("top", ($(window).scrollTop() + screenTop) + "px");
}

function clampPlayerPosition()
{
	var playerWidth = $("#Player").outerWidth();
	var playerHeight = $("#Player").outerHeight();
	playerPosition.x = Math.max(0, Math.min($(window).width() - playerWidth, playerPosition.x));
	playerPosition.y = Math.max(0, Math.min($(window).height() - playerHeight, playerPosition.y));
}

function renderPlayerPosition()
{
	clampPlayerPosition();
	$("#Player").css({
		left: playerPosition.x + "px",
		top: ($(window).scrollTop() + playerPosition.y) + "px"
	});
}

function setPlayerAnimation(horizontal, vertical)
{
	var animation = Math.abs(horizontal) > Math.abs(vertical)
		? (horizontal < 0 ? "LWalk" : "RWalk")
		: "PlayerFly";
	$("#Player").css({animationName: animation, webkitAnimationName: animation});
}

function movePlayer(timestamp)
{
	var delta = previousPlayerFrame ? Math.min((timestamp - previousPlayerFrame) / 1000, 0.05) : 0;
	var horizontal = 0;
	var vertical = 0;
	previousPlayerFrame = timestamp;

	if (playerKeys.ArrowLeft || playerKeys.ArrowRight || playerKeys.ArrowUp || playerKeys.ArrowDown)
	{
		horizontal = (playerKeys.ArrowRight ? 1 : 0) - (playerKeys.ArrowLeft ? 1 : 0);
		vertical = (playerKeys.ArrowDown ? 1 : 0) - (playerKeys.ArrowUp ? 1 : 0);
		var distance = playerSpeed * delta / (horizontal && vertical ? Math.sqrt(2) : 1);
		playerPosition.x += horizontal * distance;
		playerPosition.y += vertical * distance;
	}
	else if (playerTarget)
	{
		var differenceX = playerTarget.x - playerPosition.x;
		var differenceY = playerTarget.y - playerPosition.y;
		horizontal = differenceX;
		vertical = differenceY;
		var followAmount = 1 - Math.exp(-delta * 12);
		playerPosition.x += differenceX * followAmount;
		playerPosition.y += differenceY * followAmount;
		if (Math.abs(differenceX) < 1 && Math.abs(differenceY) < 1)
		{
			playerPosition.x = playerTarget.x;
			playerPosition.y = playerTarget.y;
			playerTarget = null;
		}
	}

	renderPlayerPosition();
	if (horizontal || vertical)
	{
		setPlayerAnimation(horizontal, vertical);
	}
	else
	{
		$("#Player").css({animationName: "", webkitAnimationName: ""});
	}

	if (playerTarget || playerKeys.ArrowLeft || playerKeys.ArrowRight || playerKeys.ArrowUp || playerKeys.ArrowDown)
	{
		playerFrame = window.requestAnimationFrame(movePlayer);
	}
	else
	{
		playerFrame = null;
		previousPlayerFrame = 0;
	}
}

function startPlayerMovement()
{
	if (playerFrame === null)
	{
		playerFrame = window.requestAnimationFrame(movePlayer);
	}
}

function getPlayerArrowKey(event)
{
	var key = event.key;
	if (/^Arrow(Left|Right|Up|Down)$/.test(key))
	{
		return key;
	}

	return {
		37: "ArrowLeft",
		38: "ArrowUp",
		39: "ArrowRight",
		40: "ArrowDown"
	}[event.which || event.keyCode] || "";
}

function activatePlayerControls()
{
	var playerBounds = document.getElementById("Player").getBoundingClientRect();
	playerPosition.x = playerBounds.left;
	playerPosition.y = playerBounds.top;

	$(document).keydown(function(event)
	{
		var key = getPlayerArrowKey(event);
		if (key)
		{
			event.preventDefault();
			playerControlled = true;
			playerTarget = null;
			if (!playerKeys[key])
			{
				var horizontal = key === "ArrowRight" ? 1 : key === "ArrowLeft" ? -1 : 0;
				var vertical = key === "ArrowDown" ? 1 : key === "ArrowUp" ? -1 : 0;
				playerPosition.x += horizontal * 14;
				playerPosition.y += vertical * 14;
				renderPlayerPosition();
				setPlayerAnimation(horizontal, vertical);
			}
			playerKeys[key] = true;
			startPlayerMovement();
		}
	});

	$(document).keyup(function(event)
	{
		var key = getPlayerArrowKey(event);
		if (playerKeys[key])
		{
			playerKeys[key] = false;
		}
	});

	$(window).blur(function()
	{
		playerKeys = {};
		playerTarget = null;
		if (playerFrame !== null)
		{
			window.cancelAnimationFrame(playerFrame);
			playerFrame = null;
			previousPlayerFrame = 0;
			$("#Player").css({animationName: "", webkitAnimationName: ""});
		}
	});

	$(document).mousemove(function(event)
	{
		playerControlled = true;
		playerTarget = {
			x: Math.max(0, Math.min($(window).width() - $("#Player").outerWidth(),
				event.clientX - $("#Player").outerWidth() / 2)),
			y: Math.max(0, Math.min($(window).height() - $("#Player").outerHeight(),
				event.clientY - $("#Player").outerHeight() / 2))
		};
		startPlayerMovement();
	});
}

layoutVerticalScene();
activatePlayerControls();

$(window).resize(function()
{
	var progress = getScrollDistance() - $(window).scrollTop();
	layoutVerticalScene();
	window.scrollTo(0, Math.max(0, getScrollDistance() - progress));
	clampPlayerPosition();
	updateVerticalPlayer();
});
</script >

<script type="text/javascript">

var ActionPoint1 = ScreenWidth / 7;

//當前視窗寬度 / 1.25 = 第二個觸發點
var ActionPoint2 = ScreenWidth / 1.25;

//當前視窗寬度 / 0.315 = 第三個觸發點

//當前視窗寬度 / 0.25 = 第四個觸發點
var ActionPoint4 = ScreenWidth / 0.25;

//當前視窗寬度 / 0.19 = 第五個觸發點
var ActionPoint5 = ScreenWidth / 0.19;

	//取得視窗寬度跟高度
	ScreenWidth = $(window).width();
	ScreenHeight = $(window).height();
	
	//當前視窗寬度 / 7(排版的當前視窗寬1280px / 當時固定的觸發像素位置182px = 7)= 第一個觸發點
	ActionPoint1 = ScreenWidth / 7;
	
	//當前視窗寬度 / 1.25 = 第二個觸發點
	ActionPoint2 = ScreenWidth / 1.25;
	
	//當前視窗寬度 / 0.315 = 第三個觸發點
	ActionPoint3 = ScreenWidth / 0.315;
	
	//當前視窗寬度 / 0.25 = 第四個觸發點
	ActionPoint4 = ScreenWidth / 0.25;
	
	//當前視窗寬度 / 0.19 = 第五個觸發點
	ActionPoint5 = ScreenWidth / 0.19;
	
	//依視窗寬度調整角色跳躍距離
	JumpUp = ScreenWidth / 3.31;
	
	//依底部起算的垂直捲動距離換算場景瀏覽進度
	currentScroll = getScrollDistance() - $(this).scrollTop();

	//直式場景中，角色隨捲動進度從底部往上飛
	updateVerticalPlayer();
	
	//豬播放走路動畫
	$("#Pig").css('webkitAnimationName', 'PigWalk');
	
	//往上瀏覽時角色播放移動動畫
	if(currentScroll > previousScroll)
	{		
		//直式場景使用飛行影格，橫式場景沿用走路動畫
		var playerAnimation = $("body").hasClass("vertical-layout") ? "PlayerFly" : "RWalk";
		$("#Player").css({animationName:playerAnimation, webkitAnimationName:playerAnimation});
		
		//只要每過完250毫秒就執行funtion idel
		clearTimeout(timer);		
		timer = setTimeout(idel , 250); 					
	}
	
	//往下瀏覽時場景向右移動
	else if(currentScroll < previousScroll)
	{
		//直式場景的角色隨捲動往返，橫式場景沿用原本動畫
		var playerAnimation = $("body").hasClass("vertical-layout") ? "PlayerFly" : "LWalk";
		$("#Player").css({animationName:playerAnimation, webkitAnimationName:playerAnimation});
			
		//只要每過完250毫秒就執行funtion idel
		clearTimeout(timer);		
		timer = setTimeout(idel , 250); 		
	}
	
	//瀏覽進度到達第一個觸發點
	if(currentScroll > ActionPoint1)
	{					
		//判斷豬是否跳躍過第一次
		if(PigJump == 0)
		{			
			//隊列動畫實現跳躍一次
			$("#Pig").animate({left:"+=250px"});
			$("#Pig").animate({left:"-=250px"});
			PigJump = 1;
		}		
	}
	
	//瀏覽進度尚未到達第一個觸發點
	else if(currentScroll < ActionPoint1)
	{
		//把豬的跳躍狀態恢復為0
		PigJump = 0;
	}
	
	//瀏覽進度到達第二個觸發點
	if(currentScroll >= ActionPoint2 && !BatsReleased)
	{				
		//蝙蝠沿場景橫向飛出
		$("#Bat1").animate({left:"15%"}, 3500);
		$("#Bat2").animate({left:"25%"}, 3500);
		$("#Bat3").animate({left:"35%"}, 4000);
		$("#Bat4").animate({left:"45%"}, 5000);
		$("#Bat5").animate({left:"55%"}, 3500);
		$("#Bat6").animate({left:"65%"}, 4000);
		$("#Bat7").animate({left:"75%"}, 5000);
		$("#Bat8").animate({left:"25%"}, 3500);
		$("#Bat9").animate({left:"45%"}, 4000);
		$("#Bat10").animate({left:"65%"}, 5000);
		BatsReleased = true;
	}
	
	//瀏覽進度到達第三個觸發點
	if(currentScroll > ActionPoint3)
	{		
		//判斷豬是否跳躍過第二次
		if(PigJump == 1)
		{			
			//隊列動畫實現跳躍一次
			$("#Pig").animate({left:"+=" + JumpUp});
			$("#Pig").animate({left:"-=" + JumpUp});
			PigJump = 2;
		}		
	}
	
	//瀏覽進度尚未到達第三個觸發點，但已超過第一個觸發點
	else if(currentScroll < ActionPoint3 && currentScroll > ActionPoint1)
	{
		//把豬的跳躍狀態恢復為1
		PigJump = 1;
	}
	
	//瀏覽進度已超過第四個觸發點，但尚未超過第五個觸發點
	if (currentScroll > ActionPoint4 && currentScroll < ActionPoint5)
	{
		$("#Speak").animate({height:"150px"}, 2000);
	}
	
	//更新舊瀏覽進度
	previousScroll = currentScroll;     
}); 

//當沒有捲動的時候 
var idel = function () 
{        	
	//玩家動畫取消播放
	$("#Player").css({animationName:'', webkitAnimationName:''});
	
	//豬動畫取消播放
	$("#Pig").css('webkitAnimationName', '');	 
};  

//初始位置放在頁面最底部，讓使用者向上瀏覽整個場景
if ("scrollRestoration" in window.history)
{
	window.history.scrollRestoration = "manual";
}

function startAtBottom()
{
	window.scrollTo(0, getScrollDistance());
	updateVerticalPlayer();
}

startAtBottom();
$(window).load(startAtBottom);
</script>
